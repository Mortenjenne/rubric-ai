services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-rubricai}
      POSTGRES_USER: ${DB_USER:-rubricai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment before starting the database}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - rubricai-pgdata:/var/lib/postgresql/data

volumes:
  rubricai-pgdata:
