spring:
  application:
    name: rubric-ai-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rubricai}
    username: ${DB_USER:rubricai}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

cors:
  # Vite's default dev server, under both hostnames a browser reaches it by — an origin is matched
  # as an exact string, so localhost and 127.0.0.1 are two different origins and both need listing.
  # If Vite finds 5173 busy it binds 5174 and the browser blocks the request again; add the port
  # here when that happens. Override with a comma-separated list for other environments (e.g. a
  # deployed frontend origin) — CorsProperties binds it to a List<String>.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

app:
  # Educator accounts seeded at startup — there is no registration endpoint. Add one entry per
  # account; each password must come from its own environment variable so nothing is committed.
  # An entry whose password variable is unset is skipped with a warning, not a startup failure.
  educators: []
  #  - email: educator@example.com
  #    display-name: Some Educator
  #    password: ${EDUCATOR1_PASSWORD:}

jwt:
  # jwt.secret is deliberately absent here: it is bound straight from the JWT_SECRET environment
  # variable (see JwtProperties), the same way OPENAI_API_KEY is never named in this file either.
  # Generate a random secret of at least 32 bytes, e.g. `openssl rand -base64 48`.
  #
  # Long-lived with no refresh (per the spec) — an Educator logs in again once this expires.
  expiration: ${JWT_EXPIRATION:30d}

llm:
  # Provider is fixed to openai until a second adapter lands (ADR 0001). gpt-4o-mini's rejection
  # rate on this Rubric's evidence-quote check (ADR 0005) was too high for student-facing use — a
  # sample against the live API put it around one in eight — so the default here is gpt-5.4:
  # verified against the live API to still accept temperature 0 (the spec's determinism
  # requirement, ADR 0002) and, at that setting, produced zero rejected payloads across five
  # sample runs against this Rubric. Every tier from gpt-5.5 onward is reasoning-only and rejects
  # any temperature but its default of 1 ("Only the default (1) value is supported"), so gpt-5.4
  # is the strongest tier compatible with the determinism requirement as of this writing — check
  # again before assuming a newer tier is safe to move to. Override LLM_MODEL to a cheaper tier
  # (e.g. gpt-4o-mini) for low-stakes local development. OPENAI_API_KEY must be set in the
  # environment — never committed here.
  provider: ${LLM_PROVIDER:openai}
  model: ${LLM_MODEL:gpt-5.4}
