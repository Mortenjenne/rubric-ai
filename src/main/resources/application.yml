spring:
  application:
    name: rubric-ai-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rubricai}
    username: ${DB_USER:rubricai}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

llm:
  # Provider is fixed to openai until a second adapter lands (ADR 0001). gpt-5.6-luna is
  # OpenAI's current cheap tier and supports Structured Outputs on Chat Completions, so it's
  # the default for development; override LLM_MODEL to a stronger tier (e.g. gpt-5.6-sol) for
  # the demo. OPENAI_API_KEY must be set in the environment — never committed here.
  provider: ${LLM_PROVIDER:openai}
  model: ${LLM_MODEL:gpt-5.6-luna}
