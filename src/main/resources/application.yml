spring:
  application:
    name: rubric-ai-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rubricai}
    username: ${DB_USER:rubricai}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

cors:
  # Vite's default dev server, under both hostnames a browser reaches it by — an origin is matched
  # as an exact string, so localhost and 127.0.0.1 are two different origins and both need listing.
  # If Vite finds 5173 busy it binds 5174 and the browser blocks the request again; add the port
  # here when that happens. Override with a comma-separated list for other environments (e.g. a
  # deployed frontend origin) — CorsProperties binds it to a List<String>.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

llm:
  # Provider is fixed to openai until a second adapter lands (ADR 0001). gpt-4o-mini is
  # OpenAI's cheap tier, supports Structured Outputs on Chat Completions, and — unlike the
  # newer reasoning-style tiers (verified against the live API: gpt-5.6-luna rejects any
  # temperature override with "Only the default (1) value is supported") — actually honours
  # the spec's temperature-zero requirement. Override LLM_MODEL to a stronger tier (e.g.
  # gpt-4.1 or gpt-4o) for the demo; confirm any override also accepts a custom temperature
  # before relying on it. OPENAI_API_KEY must be set in the environment — never committed here.
  provider: ${LLM_PROVIDER:openai}
  model: ${LLM_MODEL:gpt-4o-mini}
